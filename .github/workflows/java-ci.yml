name: Java CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PR Quality
    runs-on: [self-hosted, ci]
    timeout-minutes: 45

    container:
      image: maven:3.9.16-eclipse-temurin-21
      options: >-
        --memory=1400m
        --cpus=1

    defaults:
      run:
        shell: bash

    env:
      MAVEN_OPTS: >-
        -Xms128m
        -Xmx768m
        -XX:MaxMetaspaceSize=256m
        -Dmaven.repo.local=/tmp/m2
      SONAR_USER_HOME: /tmp/sonar

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Trust workspace directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and tests
        run: mvn --batch-mode --no-transfer-progress -Dmaven.test.failure.ignore=true clean verify

      - name: Prepare proxy network connection
        run: |
          mkdir -p target
          cat > target/ci-connect-proxy.sh <<'BASH'
          : "${PROXY_NETWORK_NAME:?Set GitHub variable PROXY_NETWORK_NAME}"
          : "${CI_CONTAINER_ID:?Missing CI job container ID}"
          docker network connect -- "$PROXY_NETWORK_NAME" "$CI_CONTAINER_ID"
          BASH

      - name: Connect CI container to proxy network
        uses: docker://ghcr.io/catthehacker/ubuntu:act-24.04
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          PROXY_NETWORK_NAME: ${{ vars.PROXY_NETWORK_NAME }}
          CI_CONTAINER_ID: ${{ job.container.id }}
        with:
          entrypoint: bash
          args: -euo pipefail target/ci-connect-proxy.sh

      - name: SonarQube Cloud analysis and Quality Gate
        env:
          SONAR_SCANNER_PROXY_HOST: gost
          SONAR_SCANNER_PROXY_PORT: "8080"
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          set -euo pipefail
          : "${SONAR_TOKEN:?Set GitHub secret SONAR_TOKEN; fork PR analysis is unavailable}"
          : "${SONAR_ORGANIZATION:?Set GitHub variable SONAR_ORGANIZATION}"
          : "${SONAR_PROJECT_KEY:?Set GitHub variable SONAR_PROJECT_KEY}"
          mvn --batch-mode --no-transfer-progress \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            "-Dsonar.organization=$SONAR_ORGANIZATION" \
            "-Dsonar.projectKey=$SONAR_PROJECT_KEY" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          if-no-files-found: warn
          path: |
            target/site/jacoco/
            target/surefire-reports/

      - name: Clean build output
        if: always()
        run: |
          set -euo pipefail
          : "${GITHUB_WORKSPACE:?Missing runner workspace}"
          test "$GITHUB_WORKSPACE" != /
          rm -rf -- "$GITHUB_WORKSPACE/target"
