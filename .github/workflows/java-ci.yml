name: Java CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PR Quality
    runs-on: [self-hosted, ci]

    container:
      image: maven:3.9.16-eclipse-temurin-21
      options: >-
        --memory=1400m
        --cpus=1
        --volume /srv/github-runner/ci/cache/m2:/root/.m2

    defaults:
      run:
        shell: bash

    env:
      MAVEN_OPTS: >-
        -Xms128m
        -Xmx768m
        -XX:MaxMetaspaceSize=256m
      BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch PR base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "$BASE_SHA"

      - name: Install diff tools
        id: tools
        if: github.event_name == 'pull_request'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv
          python3 -m venv /tmp/pr-quality-venv
          /tmp/pr-quality-venv/bin/python -m pip install diff-cover==10.6.0

      - name: Build, tests and analysis reports
        id: build
        continue-on-error: true
        run: |
          mvn --batch-mode --no-transfer-progress \
            clean verify pmd:pmd spotbugs:spotbugs

      - name: Normalize reports
        id: normalize
        if: >-
          github.event_name == 'pull_request' &&
          steps.build.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/normalize_quality_reports.py

      - name: Changed lines coverage — minimum 80%
        id: coverage
        if: >-
          github.event_name == 'pull_request' &&
          steps.normalize.outcome == 'success'
        continue-on-error: true
        run: |
          /tmp/pr-quality-venv/bin/diff-cover \
            target/site/jacoco/jacoco.xml \
            --compare-branch="$BASE_SHA" \
            --src-roots=src/main/java \
            --fail-under=80 \
            --total-percent-float \
            --format=markdown:target/diff-coverage.md

      - name: PMD on changed lines
        id: pmd
        if: >-
          github.event_name == 'pull_request' &&
          steps.normalize.outcome == 'success'
        continue-on-error: true
        run: |
          /tmp/pr-quality-venv/bin/diff-quality \
            --violations=pmd target/pmd-diff.xml \
            --compare-branch="$BASE_SHA" \
            --fail-under=100 \
            --format=markdown:target/diff-pmd.md

      - name: Checkstyle on changed lines
        id: checkstyle
        if: >-
          github.event_name == 'pull_request' &&
          steps.normalize.outcome == 'success'
        continue-on-error: true
        run: |
          /tmp/pr-quality-venv/bin/diff-quality \
            --violations=checkstylexml target/checkstyle-diff.xml \
            --compare-branch="$BASE_SHA" \
            --fail-under=100 \
            --format=markdown:target/diff-checkstyle.md

      - name: SpotBugs and security on changed lines
        id: spotbugs
        if: >-
          github.event_name == 'pull_request' &&
          steps.normalize.outcome == 'success'
        continue-on-error: true
        run: |
          /tmp/pr-quality-venv/bin/diff-quality \
            --violations=findbugs target/spotbugs-diff.xml \
            --compare-branch="$BASE_SHA" \
            --fail-under=100 \
            --format=markdown:target/diff-spotbugs.md

      - name: Job summary
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          TOOLS_RESULT: ${{ steps.tools.outcome }}
          NORMALIZE_RESULT: ${{ steps.normalize.outcome }}
          COVERAGE_RESULT: ${{ steps.coverage.outcome }}
          PMD_RESULT: ${{ steps.pmd.outcome }}
          CHECKSTYLE_RESULT: ${{ steps.checkstyle.outcome }}
          SPOTBUGS_RESULT: ${{ steps.spotbugs.outcome }}
        run: |
          {
            echo "## PR Quality"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Build and tests | $BUILD_RESULT |"

            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "| Diff tools | $TOOLS_RESULT |"
              echo "| Report normalization | $NORMALIZE_RESULT |"
              echo "| Changed lines coverage ≥ 80% | $COVERAGE_RESULT |"
              echo "| PMD | $PMD_RESULT |"
              echo "| Checkstyle | $CHECKSTYLE_RESULT |"
              echo "| SpotBugs and security | $SPOTBUGS_RESULT |"
              echo

              for report in \
                target/diff-coverage.md \
                target/diff-pmd.md \
                target/diff-checkstyle.md \
                target/diff-spotbugs.md
              do
                echo
                if [ -f "$report" ]; then
                  cat "$report"
                else
                  echo "Report unavailable: $report"
                fi
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          if-no-files-found: warn
          path: |
            target/diff-*.md
            target/*-diff.xml
            target/pmd.xml
            target/checkstyle-result.xml
            target/spotbugsXml.xml
            target/site/jacoco/
            target/surefire-reports/

      - name: Enforce quality gate
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          TOOLS_RESULT: ${{ steps.tools.outcome }}
          NORMALIZE_RESULT: ${{ steps.normalize.outcome }}
          COVERAGE_RESULT: ${{ steps.coverage.outcome }}
          PMD_RESULT: ${{ steps.pmd.outcome }}
          CHECKSTYLE_RESULT: ${{ steps.checkstyle.outcome }}
          SPOTBUGS_RESULT: ${{ steps.spotbugs.outcome }}
        run: |
          failed=0

          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::Build or tests failed."
            failed=1
          fi

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            for result in \
              "$TOOLS_RESULT" \
              "$NORMALIZE_RESULT" \
              "$COVERAGE_RESULT" \
              "$PMD_RESULT" \
              "$CHECKSTYLE_RESULT" \
              "$SPOTBUGS_RESULT"
            do
              if [ "$result" != "success" ]; then
                failed=1
              fi
            done
          fi

          if [ "$failed" -ne 0 ]; then
            echo "::error::Quality gate failed. See the job summary."
            exit 1
          fi