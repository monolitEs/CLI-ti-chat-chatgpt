services:
  codex:
    build:
      context: .
      dockerfile: docker/codex/Dockerfile
    environment:
      CODEX_HOME: /home/codex/.codex
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      HTTP_PROXY: http://gost:8080
      HTTPS_PROXY: http://gost:8080
      ALL_PROXY: http://gost:8080
      NO_PROXY: localhost,127.0.0.1,gost
      http_proxy: http://gost:8080
      https_proxy: http://gost:8080
      all_proxy: http://gost:8080
      no_proxy: localhost,127.0.0.1,gost
    volumes:
      - type: bind
        source: ${CODEX_DATA_DIR:?Set CODEX_DATA_DIR in .env}
        target: /home/codex/.codex
        bind:
          create_host_path: false
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - codex
      - proxy

networks:
  codex:
    name: cli-to-chat
  proxy:
    external: true
    name: ${PROXY_NETWORK_NAME:?Set PROXY_NETWORK_NAME to the existing GOST network}
